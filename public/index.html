<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>wisdomhouse new book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  * { box-sizing: border-box; font-family: 'Gowun Dodum', sans-serif; }
  html, body { margin: 0; background: #FAF7F0; color: #3A332B; }
  body { min-height: 100vh; padding-bottom: 60px; }

  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: #FFFFFF; border-bottom: 1px solid #ECE6D8;
    padding: 14px 20px; display: flex; align-items: center; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand .logo-dot {
    width: 30px; height: 30px; border-radius: 50%;
    background: #8FB57E; color: #fff; display: flex; align-items: center; justify-content: center;
    font-family: 'Jua', sans-serif; font-size: 15px;
  }
  .brand .brand-text { font-family: 'Jua', sans-serif; font-size: 17px; letter-spacing: 0.2px; color: #3A332B; }
  .topbar .icon-btn { color: #B3A692; }

  .feed { max-width: 470px; margin: 24px auto; padding: 0 14px; display: flex; flex-direction: column; gap: 22px; }

  .post {
    background: #FFFFFF; border: 1px solid #ECE6D8; border-radius: 14px; overflow: hidden;
  }
  .post-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; }
  .post-header .who { display: flex; align-items: center; gap: 10px; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 15px; color: #fff;
  }
  .avatar.green { background: #8FB57E; }
  .avatar.coral { background: #E39B72; }
  .who .name { font-weight: 500; font-size: 14px; color: #3A332B; }
  .who .tag { font-size: 11.5px; color: #B3A692; }
  .dots { color: #C4B8A8; font-size: 18px; letter-spacing: 1px; }

  .media {
    border-top: 1px solid #F3EEE1; border-bottom: 1px solid #F3EEE1;
    background: #FFFCF7; padding: 18px 16px;
  }

  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tab-btn {
    border: 2px solid #F0E9DD; background: #FFFCF7; color: #A79C86;
    border-radius: 999px; padding: 8px 16px; font-size: 13.5px; font-weight: 500;
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    transition: all .15s ease;
  }
  .tab-btn.active { background: #8FB57E; border-color: #8FB57E; color: #fff; }

  textarea {
    width: 100%; resize: vertical; border: 2px solid #F0E9DD; border-radius: 16px;
    padding: 14px 16px; font-size: 14.5px; line-height: 1.7; background: #FFFCF7;
    color: #3A332B; outline: none;
  }
  textarea:focus { outline: 3px solid #A8C3A0; outline-offset: 2px; }
  textarea::placeholder { color: #C4B8A8; }

  .dropzone {
    border: 2px dashed #E4DAC0; border-radius: 16px; padding: 26px 14px;
    text-align: center; background: #FFFFFF; cursor: pointer; transition: border-color .15s;
  }
  .dropzone:hover, .dropzone.dragover { border-color: #8FB57E; background: #F6FAF3; }
  .dropzone .icon { font-size: 26px; margin-bottom: 6px; }
  .dropzone .main-text { font-size: 14px; color: #6B6250; margin-bottom: 4px; }
  .dropzone .sub-text { font-size: 12px; color: #B3A692; }

  .file-preview {
    margin-top: 12px; background: #F6FAF3; border-radius: 14px; padding: 12px 14px;
    font-size: 12.5px; color: #6B8A5A; display: none;
  }
  .file-preview .file-name { font-weight: 500; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .file-preview .file-name button {
    background: none; border: none; color: #B3A692; cursor: pointer; font-size: 12.5px;
  }
  .file-preview .snippet { color: #8A9C7C; line-height: 1.6; max-height: 70px; overflow: hidden; }

  .output-box { min-height: 90px; }
  .output-placeholder { color: #C4B8A8; font-size: 13.5px; line-height: 1.8; }
  .output-text { white-space: pre-wrap; font-size: 14.5px; line-height: 1.85; color: #3A332B; }

  .actions-row { display: flex; align-items: center; gap: 14px; padding: 10px 14px 0; color: #6B6250; }
  .actions-row svg { display: block; }
  .actions-row .spacer { flex: 1; }

  .caption { padding: 8px 14px 4px; font-size: 13.5px; color: #6B6250; line-height: 1.6; }
  .caption b { color: #3A332B; }

  .post-footer { padding: 10px 14px 16px; }
  button.wide-btn {
    width: 100%; border: none; cursor: pointer; font-size: 15px; font-weight: 500;
    border-radius: 999px; padding: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: background .15s, transform .15s;
  }
  .btn-generate { background: #8FB57E; color: #fff; box-shadow: 0 6px 16px rgba(143,181,126,0.35); }
  .btn-generate:hover:not(:disabled) { background: #7FA070; transform: translateY(-1px); }
  .btn-generate:disabled { opacity: .55; cursor: not-allowed; }
  .btn-copy { background: #FBEFE3; color: #C9895A; }
  .btn-copy:hover { background: #FBE2D3; }

  .reset-link { text-align: center; margin-top: 8px; }
  .reset-link button {
    background: transparent; border: none; color: #B3A692; font-size: 13px; cursor: pointer;
  }
  .reset-link button:hover { color: #3A332B; }

  .error { color: #D97F5A; font-size: 13px; padding: 0 14px 6px; font-weight: 500; }
  @keyframes spin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <span class="logo-dot">W</span>
      <span class="brand-text">wisdomhouse new book</span>
    </div>
    <span class="icon-btn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
        <path d="M20.8 8.6c0-3.4-2.6-5.6-5.6-5.6-1.4 0-2.8.6-3.7 1.7C10.6 3.6 9.2 3 7.8 3 4.8 3 2.2 5.2 2.2 8.6c0 6 8.4 11 9.2 11.4.3.2.7.2 1 0 .8-.4 9.4-5.4 9.4-11.4z"/>
      </svg>
    </span>
  </div>

  <div class="feed">

    <!-- Post 1: input -->
    <div class="post">
      <div class="post-header">
        <div class="who">
          <span class="avatar green">🍡</span>
          <div>
            <div class="name">wisdomhouse_newbook</div>
            <div class="tag" id="stepTag">STEP 1 · 원고 준비하기</div>
          </div>
        </div>
        <span class="dots">•••</span>
      </div>

      <div class="media">
        <div class="tabs">
          <button id="tabFile" class="tab-btn active">📚 새로나온책</button>
          <button id="tabText" class="tab-btn">🔍 위뷰</button>
        </div>

        <div id="panelFile">
          <div id="dropzone" class="dropzone">
            <div class="icon">📄</div>
            <div class="main-text">보도자료 파일을 여기에 끌어다 놓거나 클릭해서 선택하세요</div>
            <div class="sub-text">.txt / .docx / .pdf 지원</div>
          </div>
          <input type="file" id="fileInput" accept=".txt,.docx,.pdf" style="display:none;" />
          <div id="filePreview" class="file-preview">
            <div class="file-name">
              <span id="fileNameText"></span>
              <button id="removeFileBtn">삭제</button>
            </div>
            <div id="fileSnippet" class="snippet"></div>
          </div>
        </div>

        <div id="panelText" style="display:none;">
          <textarea id="input" rows="7" placeholder="위뷰 서평단을 모집할 도서 정보(제목, 소개, 모집 조건 등)를 붙여넣어 주세요..."></textarea>
        </div>
      </div>

      <div class="actions-row">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20.8 8.6c0-3.4-2.6-5.6-5.6-5.6-1.4 0-2.8.6-3.7 1.7C10.6 3.6 9.2 3 7.8 3 4.8 3 2.2 5.2 2.2 8.6c0 6 8.4 11 9.2 11.4.3.2.7.2 1 0 .8-.4 9.4-5.4 9.4-11.4z"/></svg>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.3 0-2.5-.3-3.6-.8L3 21l1.8-5.4A8.4 8.4 0 0 1 3.5 11.5 8.5 8.5 0 0 1 12 3a8.5 8.5 0 0 1 9 8.5z"/></svg>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M22 3 11 14"/><path d="M22 3 15 21l-4-7-7-4 18-7z"/></svg>
        <span class="spacer"></span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>
      </div>

      <div class="caption" id="captionText"><b>wisdomhouse_newbook</b> 보도자료나 노션 기획의도를 붙여 넣어주세요!</div>

      <div id="error" class="error" style="display:none;"></div>

      <div class="post-footer">
        <button id="generateBtn" class="wide-btn btn-generate">✏️ <span id="generateLabel">카피 생성하기</span></button>
        <div class="reset-link"><button id="resetBtn">↺ 초기화</button></div>
      </div>
    </div>

    <!-- Post 2: output -->
    <div class="post">
      <div class="post-header">
        <div class="who">
          <span class="avatar coral">🍰</span>
          <div>
            <div class="name">wisdomhouse_newbook</div>
            <div class="tag">STEP 2 · 완성된 카피</div>
          </div>
        </div>
        <span class="dots">•••</span>
      </div>

      <div class="media">
        <div id="outputArea" class="output-box">
          <div class="output-placeholder">원고를 입력하고 생성 버튼을 누르면 이곳에 카피가 몽글몽글 나타나요 ☁️</div>
        </div>
      </div>

      <div class="actions-row">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20.8 8.6c0-3.4-2.6-5.6-5.6-5.6-1.4 0-2.8.6-3.7 1.7C10.6 3.6 9.2 3 7.8 3 4.8 3 2.2 5.2 2.2 8.6c0 6 8.4 11 9.2 11.4.3.2.7.2 1 0 .8-.4 9.4-5.4 9.4-11.4z"/></svg>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.3 0-2.5-.3-3.6-.8L3 21l1.8-5.4A8.4 8.4 0 0 1 3.5 11.5 8.5 8.5 0 0 1 12 3a8.5 8.5 0 0 1 9 8.5z"/></svg>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M22 3 11 14"/><path d="M22 3 15 21l-4-7-7-4 18-7z"/></svg>
        <span class="spacer"></span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>
      </div>

      <div id="copyWrap" class="post-footer" style="display:none;">
        <button id="copyBtn" class="wide-btn btn-copy">📋 텍스트 복사</button>
      </div>
    </div>

  </div>

<script>
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }

  const tabFile = document.getElementById('tabFile');
  const tabText = document.getElementById('tabText');
  const panelFile = document.getElementById('panelFile');
  const panelText = document.getElementById('panelText');
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const filePreview = document.getElementById('filePreview');
  const fileNameText = document.getElementById('fileNameText');
  const fileSnippet = document.getElementById('fileSnippet');
  const removeFileBtn = document.getElementById('removeFileBtn');
  const textInput = document.getElementById('input');
  const errorEl = document.getElementById('error');
  const generateBtn = document.getElementById('generateBtn');
  const generateLabel = document.getElementById('generateLabel');
  const resetBtn = document.getElementById('resetBtn');
  const outputArea = document.getElementById('outputArea');
  const copyWrap = document.getElementById('copyWrap');
  const copyBtn = document.getElementById('copyBtn');
  const captionText = document.getElementById('captionText');
  const stepTag = document.getElementById('stepTag');

  let activeTab = 'file';
  let extractedFileText = '';
  let lastOutput = '';

  function switchTab(tab) {
    activeTab = tab;
    tabFile.classList.toggle('active', tab === 'file');
    tabText.classList.toggle('active', tab === 'text');
    panelFile.style.display = tab === 'file' ? 'block' : 'none';
    panelText.style.display = tab === 'text' ? 'block' : 'none';
    errorEl.style.display = 'none';

    if (tab === 'file') {
      stepTag.textContent = 'STEP 1 · 새로나온책';
      captionText.innerHTML = '<b>wisdomhouse_newbook</b> 보도자료나 노션 기획의도를 붙여 넣어주세요!';
    } else {
      stepTag.textContent = 'STEP 1 · 위뷰 모집';
      captionText.innerHTML = '<b>wisdomhouse_newbook</b> 위뷰 서평단을 모집할 도서 정보를 붙여 넣어주세요!';
    }
  }
  tabFile.addEventListener('click', () => switchTab('file'));
  tabText.addEventListener('click', () => switchTab('text'));

  dropzone.addEventListener('click', () => fileInput.click());
  dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
  dropzone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropzone.classList.remove('dragover');
    if (e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', (e) => {
    if (e.target.files && e.target.files[0]) handleFile(e.target.files[0]);
  });

  removeFileBtn.addEventListener('click', () => {
    extractedFileText = '';
    fileInput.value = '';
    filePreview.style.display = 'none';
    dropzone.style.display = 'block';
  });

  async function handleFile(file) {
    errorEl.style.display = 'none';
    const name = file.name.toLowerCase();
    try {
      let text = '';
      if (name.endsWith('.txt')) {
        text = await file.text();
      } else if (name.endsWith('.docx')) {
        const arrayBuffer = await file.arrayBuffer();
        const result = await mammoth.extractRawText({ arrayBuffer });
        text = result.value;
      } else if (name.endsWith('.pdf')) {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        const pages = [];
        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const content = await page.getTextContent();
          pages.push(content.items.map((it) => it.str).join(' '));
        }
        text = pages.join('\n\n');
      } else {
        throw new Error('지원하지 않는 파일 형식이에요.');
      }
      text = text.trim();
      if (!text) throw new Error('파일에서 텍스트를 읽지 못했어요.');
      extractedFileText = text;
      fileNameText.textContent = '📄 ' + file.name;
      fileSnippet.textContent = text.length > 140 ? text.slice(0, 140) + '...' : text;
      filePreview.style.display = 'block';
      dropzone.style.display = 'none';
    } catch (err) {
      errorEl.textContent = '파일을 읽는 중 문제가 생겼어요. 다른 파일이거나 텍스트 붙여넣기를 이용해 주세요.';
      errorEl.style.display = 'block';
    }
  }

  function setLoading(loading) {
    generateBtn.disabled = loading;
    generateLabel.textContent = loading ? '쓰는 중...' : '카피 생성하기';
  }

  resetBtn.addEventListener('click', () => {
    textInput.value = '';
    extractedFileText = '';
    fileInput.value = '';
    filePreview.style.display = 'none';
    dropzone.style.display = 'block';
    errorEl.style.display = 'none';
    copyWrap.style.display = 'none';
    outputArea.innerHTML = '<div class="output-placeholder">원고를 입력하고 생성 버튼을 누르면 이곳에 카피가 몽글몽글 나타나요 ☁️</div>';
  });

  generateBtn.addEventListener('click', async () => {
    const text = activeTab === 'file' ? extractedFileText.trim() : textInput.value.trim();
    errorEl.style.display = 'none';

    if (!text) {
      errorEl.textContent = activeTab === 'file'
        ? '먼저 보도자료 파일을 첨부해 주세요.'
        : '보도자료 또는 기획의도 내용을 먼저 입력해 주세요.';
      errorEl.style.display = 'block';
      return;
    }

    setLoading(true);
    copyWrap.style.display = 'none';
    outputArea.innerHTML = '<div class="output-placeholder">톤을 맞춰서 쓰는 중이에요...</div>';

    try {
      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ input: text, mode: activeTab === 'file' ? 'book' : 'review' })
      });
      const data = await res.json();

      if (!res.ok || !data.output) {
        throw new Error(data.error || 'generation failed');
      }

      lastOutput = data.output;
      outputArea.innerHTML = '';
      const textDiv = document.createElement('div');
      textDiv.className = 'output-text';
      textDiv.textContent = data.output;
      outputArea.appendChild(textDiv);
      copyWrap.style.display = 'block';
    } catch (e) {
      outputArea.innerHTML = '<div class="output-placeholder">원고를 입력하고 생성 버튼을 누르면 이곳에 카피가 몽글몽글 나타나요 ☁️</div>';
      errorEl.textContent = '카피 생성 중 문제가 생겼어요: ' + (e.message || '알 수 없는 오류');
      errorEl.style.display = 'block';
    } finally {
      setLoading(false);
    }
  });

  copyBtn.addEventListener('click', async () => {
    if (!lastOutput) return;
    try {
      await navigator.clipboard.writeText(lastOutput);
      copyBtn.innerHTML = '✅ 복사됐어요';
      setTimeout(() => { copyBtn.innerHTML = '📋 텍스트 복사'; }, 1600);
    } catch (e) {}
  });
</script>
</body>
</html>
